<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEO Meta Inspector</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>SEO Meta Inspector</h1>
    <button id="copy-all" title="Copy all data as JSON">Copy JSON</button>
  </header>

  <nav id="tabs">
    <button class="tab-btn active" data-tab="meta-tags">Meta Tags</button>
    <button class="tab-btn" data-tab="social-media">Social Media</button>
    <button class="tab-btn" data-tab="json-ld">JSON-LD</button>
  </nav>

  <main id="content">
    <p class="loading">Extracting meta tags…</p>
  </main>

  <footer id="footer"></footer>
  <script src="meta-extractor.js"></script>
  <script src="social-media-validator.js"></script>
  <script src="jsonld-extractor.js"></script>
  <script src="popup.js"></script>
</body>
</html>
