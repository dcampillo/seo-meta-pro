name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Package extension
        run: |
          cd extension
          zip -r "../seo-meta-pro-${GITHUB_REF_NAME}.zip" .

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: seo-meta-pro-${{ github.ref_name }}.zip
